<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CMS{% endblock %} · a-piece-of-art</title>
  <link rel="stylesheet" href="{{ url_for('cms-static', path='css/cms.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
{% block layout %}
<div class="layout">
  <aside class="sidebar">
    <span class="brand">a-piece-of-art <span>CMS</span></span>
    <nav>
      {% block nav %}{% endblock %}
    </nav>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
</body>
</html>
