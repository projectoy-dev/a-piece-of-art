{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block layout %}
<div class="login">
  <form class="card login-card" method="post" action="{{ url_for('cms_login') }}">
    <h1>a-piece-of-art <span>CMS</span></h1>
    <p class="muted">관리자 계정으로 로그인하세요.</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}

    <label>이메일
      <input type="email" name="email" value="{{ email }}" required autofocus>
    </label>
    <label>비밀번호
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary">로그인</button>
  </form>
</div>
{% endblock %}
