{% extends "base.html" %}
{% block title %}{{ '작품 수정' if artwork else '새 작품' }}{% endblock %}

{% block content %}
<header class="page-header">
  <h1>{{ '작품 수정' if artwork else '새 작품' }}</h1>
  <a class="btn btn-ghost" href="{{ url_for('cms_artwork_list') }}">목록으로</a>
</header>

{% if errors %}
<div class="alert">
  <ul>{% for message in errors %}<li>{{ message }}</li>{% endfor %}</ul>
</div>
{% endif %}

<form class="card form" method="post" enctype="multipart/form-data">
  <label>제목 *
    <input type="text" name="title" value="{{ form.title or '' }}" maxlength="200" required>
  </label>

  <div class="row">
    <label>작가
      <select name="artist_id">
        <option value="">(없음)</option>
        {% for artist in artists %}
        <option value="{{ artist.id }}" {{ 'selected' if form.artist_id|string == artist.id|string }}>{{ artist.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>제작 연도
      <input type="number" name="year" value="{{ form.year if form.year is not none else '' }}" min="0" max="9999">
    </label>
  </div>

  <label>설명
    <textarea name="description" rows="6">{{ form.description or '' }}</textarea>
  </label>

  <label>이미지 <span class="muted">jpg · png · webp · gif, 20MB 이하</span>
    {% if artwork and artwork.image_key %}
    <img class="preview" src="{{ media_url(artwork.image_key) }}" alt="현재 이미지">
    {% endif %}
    <input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif">
  </label>

  <label class="checkbox">
    <input type="checkbox" name="is_published" {{ 'checked' if form.is_published }}>
    공개 (front에 노출)
  </label>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">저장</button>
  </div>
</form>
{% endblock %}
