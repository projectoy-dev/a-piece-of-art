{% extends "base.html" %}
{% block title %}대시보드{% endblock %}

{% block content %}
<header class="page-header">
  <h1>대시보드</h1>
</header>

<div class="stats">
  <a class="card stat" href="{{ url_for('cms_artwork_list') }}">
    <span class="muted">작품</span>
    <strong>{{ artwork_count }}</strong>
  </a>
  <div class="card stat">
    <span class="muted">작가</span>
    <strong>{{ artist_count }}</strong>
  </div>
</div>
{% endblock %}
