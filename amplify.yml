# AWS Amplify 빌드 설정 (front)
# TODO(front 담당자): 패키지 매니저 · 빌드 명령에 맞게 수정하세요. 아래는 pnpm 기준 예시입니다.
# Amplify 콘솔 환경변수에 AMPLIFY_MONOREPO_APP_ROOT=front 를 등록해야 합니다.
version: 1
applications:
  - appRoot: front
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Amplify 환경변수를 Next.js 빌드에 전달
            - env | grep -e NEXT_PUBLIC_ >> .env.production || true
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
